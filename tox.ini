[tox]
min_version = 4.25.0
requires =
    sphinx-scrapy[tox]==0.13.0
envlist = mypy,pylint,docs,twinecheck,pre-commit,py3{11-15},pypy3.11,jsonpath-rfc9535,benchmark

[testenv]
usedevelop = True
extras = python-jsonpath
deps =
    psutil
    pytest>=9.0
    pytest-cov>=7.0.0
    sybil
commands = pytest --cov=parsel --cov-report=term-missing --cov-report=xml --junitxml=testenv.junit.xml -o junit_family=legacy {posargs:docs parsel tests}

[testenv:mypy]
extras =
    jsonpath-rfc9535
    python-jsonpath
deps =
    {[testenv]deps}
    types-jmespath==1.1.0.20260724
    types-lxml==2026.2.16
    types-psutil==7.2.2.20260906
    py==1.11.0
    mypy==2.4.0
commands =
    mypy {posargs:parsel tests}

[testenv:pylint]
deps =
    {[testenv]deps}
    pylint==4.1.2
commands =
    pylint docs parsel tests

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.6.1
commands =
    python -m build --sdist
    twine check dist/*

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
skip_install = true

[testenv:jsonpath-rfc9535]
description = Test with jsonpath-rfc9535 as the JSONPath backend
extras = jsonpath-rfc9535

# CPU benchmarks, tracked on CodSpeed.
[testenv:benchmark]
basepython = python3.13
deps =
    {[testenv]deps}
    pytest-codspeed
passenv =
    *codspeed*
    *ci*
commands =
    pytest {posargs:tests/benchmarks} --codspeed --codspeed-mode=simulation

[min-deps]
deps =
    {[testenv]deps}
    cssselect==1.2.0
    jmespath==1.0.0
    lxml==5.1.0
    w3lib==1.19.0

[testenv:min-deps]
description = Test with pinned minimum dependency versions
basepython = python3.11
extras = python-jsonpath
deps =
    {[min-deps]deps}
    python-jsonpath==2.0.0
usedevelop = True
commands = {[testenv]commands}

[testenv:min-deps-jsonpath-rfc9535]
description = Test with pinned minimum dependency versions and jsonpath-rfc9535
basepython = python3.11
extras = jsonpath-rfc9535
deps =
    {[min-deps]deps}
    jsonpath-rfc9535==0.1.0
usedevelop = True
commands = {[testenv]commands}
